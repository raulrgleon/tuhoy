# Stack de producción TuHoy (Ghost + MySQL).
# En el Dell lo gestiona Coolify. MySQL no publica puertos.
# Secretos: usa .env (ver .env.example). No los commitees.

services:
  ghost:
    image: ghost:6.69.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --require /tuhoy/sanitize-github-theme.js
      TMPDIR: /var/lib/ghost/content/.tmp
      url: ${GHOST_URL:-https://tuhoy.com}
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ${MYSQL_USER}
      database__connection__password: ${MYSQL_PASSWORD}
      database__connection__database: ${MYSQL_DATABASE:-ghost}
      mail__transport: SMTP
      mail__from: ${MAIL_FROM:-TuHoy <info@tuhoy.com>}
      mail__options__host: ${MAIL_OPTIONS_HOST:-smtp-relay.brevo.com}
      mail__options__port: ${MAIL_OPTIONS_PORT:-587}
      mail__options__secure: ${MAIL_OPTIONS_SECURE:-false}
      mail__options__auth__user: ${MAIL_OPTIONS_AUTH_USER}
      mail__options__auth__pass: ${MAIL_OPTIONS_AUTH_PASS}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tmpfs:
      - /tmp
    volumes:
      - ghost-content-data:/var/lib/ghost/content
      - ./ghost-hooks/sanitize-github-theme.js:/tuhoy/sanitize-github-theme.js:ro
    # Detrás de Cloudflare el origen suele llegar por HTTP.
    # Estas cabeceras evitan el bucle ERR_TOO_MANY_REDIRECTS.
    labels:
      - traefik.http.middlewares.tuhoy-https-proto.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.tuhoy-https-proto.headers.customrequestheaders.X-Forwarded-Ssl=on
    expose:
      - "2368"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:2368,path:'/',headers:{'Host':'tuhoy.com','X-Forwarded-Proto':'https'}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1)).setTimeout(5000,function(){this.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ghost-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  ghost-content-data:
  ghost-mysql-data:
